<div class="min-h-screen bg-slate-950 text-slate-100 flex flex-col selection:bg-emerald-500 selection:text-slate-950">
  
  <!-- Loading Page Splash Component -->
  <app-loading-screen />

  <!-- Top Navigation Header Component -->
  <app-header />

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-20 sm:pb-8">
    @switch (state.activeTab()) {
      @case ('dashboard') {
        <app-dashboard />
      }
      @case ('contracts') {
        <app-contracts-view />
      }
      @case ('solidity') {
        <app-solidity-view />
      }
      @case ('disputes') {
        <app-disputes-view />
      }
      @case ('reputation') {
        <app-reputation-view />
      }
      @case ('messages') {
        <app-messages-view />
      }
      @case ('analytics') {
        <app-analytics-view />
      }
    }
  </main>

  <!-- Modals & Overlays Container -->
  <app-modals />

  <!-- Mobile Bottom Navigation Bar -->
  <div class="sm:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 border-t border-slate-800 backdrop-blur-lg flex items-center justify-around py-2 px-1">
    
    <button
      type="button"
      (click)="state.setActiveTab('dashboard')"
      class="flex flex-col items-center gap-0.5 p-1 text-[10px]"
      [class.text-emerald-400]="state.activeTab() === 'dashboard'"
      [class.text-slate-400]="state.activeTab() !== 'dashboard'"
    >
      <mat-icon style="font-size: 20px; width: 20px; height: 20px;">dashboard</mat-icon>
      <span>Home</span>
    </button>

    <button
      type="button"
      (click)="state.setActiveTab('contracts')"
      class="flex flex-col items-center gap-0.5 p-1 text-[10px]"
      [class.text-emerald-400]="state.activeTab() === 'contracts'"
      [class.text-slate-400]="state.activeTab() !== 'contracts'"
    >
      <mat-icon style="font-size: 20px; width: 20px; height: 20px;">account_balance_wallet</mat-icon>
      <span>Escrow</span>
    </button>

    <button
      type="button"
      (click)="state.setActiveTab('disputes')"
      class="flex flex-col items-center gap-0.5 p-1 text-[10px] relative"
      [class.text-red-400]="state.activeTab() === 'disputes'"
      [class.text-slate-400]="state.activeTab() !== 'disputes'"
    >
      <mat-icon style="font-size: 20px; width: 20px; height: 20px;">gavel</mat-icon>
      <span>Disputes</span>
      @if (state.activeDisputesCount() > 0) {
        <span class="absolute top-0 right-1 w-2 h-2 rounded-full bg-red-500"></span>
      }
    </button>

    <button
      type="button"
      (click)="state.setActiveTab('messages')"
      class="flex flex-col items-center gap-0.5 p-1 text-[10px]"
      [class.text-emerald-400]="state.activeTab() === 'messages'"
      [class.text-slate-400]="state.activeTab() !== 'messages'"
    >
      <mat-icon style="font-size: 20px; width: 20px; height: 20px;">forum</mat-icon>
      <span>Chat</span>
    </button>

    <button
      type="button"
      (click)="state.setActiveTab('analytics')"
      class="flex flex-col items-center gap-0.5 p-1 text-[10px]"
      [class.text-emerald-400]="state.activeTab() === 'analytics'"
      [class.text-slate-400]="state.activeTab() !== 'analytics'"
    >
      <mat-icon style="font-size: 20px; width: 20px; height: 20px;">query_stats</mat-icon>
      <span>Audit</span>
    </button>

  </div>

</div>
